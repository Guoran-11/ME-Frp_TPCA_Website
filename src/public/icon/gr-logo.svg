<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="78" fill="#06B6D4" fill-opacity="0.06"
          stroke="#A6F2FC" stroke-opacity="0.9" stroke-width="10"/>
  <g filter="url(#glow)">
    <circle cx="128" cy="50" r="8" fill="#06B6D4"/>
    <circle cx="128" cy="206" r="8" fill="#06B6D4"/>
  </g>
  <text x="128" y="128" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="88" font-weight="900" letter-spacing="5%"
        text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">GR</text>
</svg>
